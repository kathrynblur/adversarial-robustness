name: mnist_binary_logreg_adv
dataset: mnist
task: binary
seed: 1234

model:
  name: BinaryLogReg

train:
  epochs: 15
  lr: 0.05
  optimizer: sgd
  adv_epsilon: 0.15     # FGSM adversarial training
  adv_weight: 0.5

eval:
  epsilons: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25]
  attacks: [fgsm, pgd]
  pgd_steps: 10
